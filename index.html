<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a5f8f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="旅行档案">
<title>旅行档案 · 我们家的行程卡</title>
<style>
  :root{--sea:#0e7cb8;--sea-d:#0a5f8f;--sea-l:#e3f2fb;--sand:#fff7ea;--sun:#f5a623;--ink:#1f2937;--sub:#6b7280;--line:#e5e7eb;--card:#fff;--bg:#f2f6fa}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;font-size:15px}
  header{background:linear-gradient(135deg,#07496e,#0a5f8f 40%,#1b92cf);color:#fff}
  .hwrap{max-width:920px;margin:0 auto;padding:34px 20px 26px}
  .hwrap h1{font-size:26px;font-weight:800;letter-spacing:1px}
  .hwrap .sub{font-size:14px;opacity:.92;margin-top:6px}
  .wrap{max-width:920px;margin:0 auto;padding:20px 16px 60px}
  .trip{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(15,60,90,.05);text-decoration:none;color:inherit}
  .trip .emoji{font-size:34px;flex-shrink:0}
  .trip .info{flex:1;min-width:0}
  .trip .t{font-size:17px;font-weight:800;color:var(--sea-d)}
  .trip .d{font-size:12.5px;color:var(--sub);margin:2px 0 4px}
  .trip .r{font-size:13px;color:var(--sub)}
  .trip .go{flex-shrink:0;background:var(--sea);color:#fff;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700}
  .tip{background:var(--sand);border-left:4px solid var(--sun);border-radius:8px;padding:10px 13px;font-size:13px;color:#7a5b1e;margin-bottom:16px}
  footer{text-align:center;color:var(--sub);font-size:12px;margin-top:24px}
  @media (max-width:760px){
    .hwrap h1{font-size:22px}
    .trip{padding:14px;gap:12px}
    .trip .emoji{font-size:28px}
    .trip .t{font-size:16px}
    .trip .r{font-size:12.5px}
  }
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <h1>🗺️ 旅行档案</h1>
    <div class="sub">我们家的行程卡 · 每条行程一张卡片，点开看完整计划</div>
  </div>
</header>
<div class="wrap">
  <div class="tip">💡 手机上看：Safari 打开本页 → 分享 → 「添加到主屏幕」，以后点图标直接进档案库；每次新增行程，刷新即可看到。</div>

  <a class="trip" href="guangzhou.html">
    <span class="emoji">🚄</span>
    <span class="info">
      <span class="t">赤壁 → 广州 → 惠州 · 3天2晚亲子游</span>
      <span class="d">2026.8.20（夜）— 8.24（上午）· 5人 · 卧铺往返 · 自驾衔接</span>
      <span class="r">长隆野生动物世界 · 泮溪早茶 · 陈家祠 · 广州塔夜景+珠江夜游（晴/雨双方案）· 巽寮湾玩海</span>
    </span>
    <span class="go">打开 ›</span>
  </a>

  <!-- 以后新增行程：复制上面整条 <a class="trip"> 卡片，改 emoji/标题/日期/简介/href 即可 -->
  <footer>新增行程卡片即可扩展 · 由 GitHub Pages 托管</footer>
</div>
</body>
</html>
